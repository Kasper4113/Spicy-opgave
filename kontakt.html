<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Spicy-Kontakt</title>
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="./assets/css/kontakt.css" />
	<script src="./assets/js/app.js" defer></script>
</head>
<body>
    <header>
		<section>
			<div class="baggrundsImg">
				<img class="headerImg" src="./assets/img/Background.jpg" alt="Nav-baggrund">
				<img class="spicyLogo" src="./assets/img/Logo-Spicy-White.png" alt="spicy logo">
			</div>
			<nav class="navigation">
				<ul>
					<li><a class="specialStart" href="./index.html">START</a></li>
					<li><a href="#">OM SPICY</a></li>
					<li><a href="./Galleri.html">GALLERI</a></li>
					<li><a href="#">FAVORIT</a></li>
					<li class="special"><a href="./kontakt.html">KONTAKT</a></li>
				</ul>
			</nav>
		</section>
	</header>
    <main>
        <form class="kontakt-form" id="kontakt-form">
            <div>
                <h1>Skriv en mail til os</h1>
            </div>
            <div>
                <input type="text" name="navn" id="nameinputer" placeholder="Fulde navn...">
            </div>
            <div>
                <input type="number" id="ageinputer" placeholder="Alder..." name="age">
            </div>
            <div>
                <input type="tel" id="tlfinputer" placeholder="Tlf-nr..." name="tlf">
            </div>
            <div>
                <input type="email" id="mailinputer" placeholder="E-mail..." name="email">
            </div>
            <div>
                <input type="text" name="tekstfelt" id="message" placeholder="Skriv din besked her...">
            </div>
            <div class="sendNulstil">
                <button type="submit" id="buttoner">Send</button>
                <button type="reset">Nulstil</button>
            </div>
        </form>
    </main>
    <footer>
		<section class="footFlex">
			<div>
				<h1>KONTAKT SPICY:</h1>
				<p>SPICY Hot Company</p>
				<p>Boulevarden 39</p>
				<p>9000 Aalborg</p>
				<a href=""><p>Send os en mail:</p></a>
				<a href=""><p>Ring til os</p></a>
				<img src="./assets/img/Some-Facebook.png" alt="Facebook">
				<img src="./assets/img/SoMe-Twitter.png" alt="Twitter">
				<img src="./assets/img/SoMe-Youtube.png" alt="YouTube">
			</div>
			<div>
				<h1>GOOGLE MAPS:</h1>
				<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d1085.2299700679728!2d9.917498933842786!3d57.04366739354312!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x464932f3bcda26e3%3A0xcd44aae1c87a63c5!2sBoulevarden%2039%2C%209000%20Aalborg!5e0!3m2!1sda!2sdk!4v1778579348008!5m2!1sda!2sdk" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
			</div>
		</section>
	</footer>
</body>
</html>
